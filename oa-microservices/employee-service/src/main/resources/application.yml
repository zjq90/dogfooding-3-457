server:
  port: 8081

spring:
  application:
    name: employee-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/oa;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: never

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.oa.employee.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.oa.employee: debug
