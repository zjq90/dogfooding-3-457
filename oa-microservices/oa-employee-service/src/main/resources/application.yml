server:
  port: 8081

spring:
  application:
    name: oa-employee-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/oa;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:oa_schema.sql
      data-locations: classpath:oa_data.sql

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.oa: debug
